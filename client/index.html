<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="School Assitant - Asisten AI sederhana dan modern"
    />

    <title>School Assitant</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="app">
      <!-- =========================
             HEADER
        ========================== -->
      <header class="app-header">
        <div class="brand">
          <div class="brand-icon">🏫</div>

          <div class="brand-info">
            <h1>Skolass</h1>
            <span>
              <span class="status-dot"></span>
              Online
            </span>
          </div>
        </div>

        <button type="button" class="header-button" aria-label="More options">
          ⋮
        </button>
      </header>

      <!-- =========================
             CHAT AREA
        ========================== -->
      <section
        id="chat-box"
        class="chat-box"
        aria-live="polite"
        aria-label="Percakapan dengan School Assitant"
      >
        <!-- Welcome Screen -->
        <div class="welcome">
          <div class="welcome-icon">🏫</div>

          <h2>Halo! 👋</h2>

          <p>
            Selamat datang di School Assistant. Saya siap membantu memberikan
            informasi seputar sekolah.
          </p>

          <div class="suggestions">
            <button type="button" class="suggestion">
              📚 Informasi akademik
            </button>

            <button type="button" class="suggestion">
              🗓️ Jadwal dan kegiatan sekolah
            </button>

            <button type="button" class="suggestion">
              🏫 Fasilitas sekolah
            </button>

            <button type="button" class="suggestion">
              📝 Informasi pendaftaran
            </button>
          </div>
        </div>
      </section>

      <!-- =========================
             INPUT AREA
        ========================== -->
      <div class="input-area">
        <form id="chat-form" class="chat-form">
          <div class="input-wrapper">
            <input
              type="text"
              id="user-input"
              name="message"
              placeholder="Tanyakan sesuatu tentang sekolah..."
              autocomplete="off"
              required
            />

            <button type="submit" class="send-button" aria-label="Kirim pesan">
              <span>➤</span>
            </button>
          </div>
        </form>

        <p class="input-hint">
          School Assistant dapat membuat kesalahan. Periksa kembali informasi
          penting.
        </p>
      </div>

      <!-- =========================
             FOOTER
        ========================== -->
      <footer class="app-footer">
        <span>Powered by Skolass</span>
      </footer>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
